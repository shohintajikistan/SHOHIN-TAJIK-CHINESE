plugins {
    id 'com.android.application'
}
android {
    namespace 'tj.shohin.chinese'
    compileSdk 35
    defaultConfig {
        applicationId 'tj.shohin.chinese'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            // Signed with the standard debug certificate so the APK can be installed for testing.
            // For Google Play publication, replace this with a private release keystore.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
